<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>機捷特區・單元12生活區</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* 版面：手機單欄，桌機置中 480px；白色卡片浮在暖灰底上 */
:root{
  --bg:#F6F5F2; --card:#FFFFFF; --ink:#1F1F1F; --sub:#6B6B6B; --line:#E4E1DA; --field:#F4F2EE;
  --accent:#F08C00; --accent-ink:#C2410C;
  --shadow:0 4px 18px rgba(30,25,15,.07);
  --font:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.card-main:active,.tile:active .ic,.chip:active,.toggle:active{transform:scale(.97)}
.card-main,.tile .ic,.chip,.toggle{transition:transform .12s ease}
.map-toggle{flex:none;height:40px;padding:0 14px 0 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700}
.map-toggle[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:110px}

/* 頂部 */
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid #ECEAE5;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--ink);display:grid;place-items:center;flex:none}
.brand-text{flex:1;min-width:0;display:flex;flex-direction:column}
.brand-text b{font-size:18px;font-weight:900;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text span{font-size:12px;color:var(--sub)}
.round{width:44px;height:44px;border-radius:22px;border:0;background:var(--field);display:grid;place-items:center;flex:none}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:14px;background:var(--field)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;outline:none}
.tabs{display:flex;overflow-x:auto;margin:0 -4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:46px;padding:0 12px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:16px;color:var(--sub);font-weight:500}
.tab::after{content:"";width:100%;height:3px;border-radius:2px;background:transparent}
.tab[aria-pressed="true"]{color:var(--ink);font-weight:900}
.tab[aria-pressed="true"]::after{background:var(--accent)}

/* 地圖卡 */
.mapcard{margin:16px 16px 0;border-radius:20px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.mapwrap{position:relative;height:230px}
#map{position:absolute;inset:0;background:#ECEEE8}
.map-chip{position:absolute;top:12px;left:12px;z-index:500;height:30px;padding:0 12px;border-radius:15px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.map-close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:600}
.mapfoot{padding:12px 12px 12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.stats{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:#444}
.stats span{display:flex;align-items:center;gap:5px}
.stats b{font-weight:900;color:var(--ink)}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block;flex:none}
.pill-dark{flex:none;height:40px;padding:0 16px;border-radius:20px;border:0;background:var(--ink);color:#fff;font-size:14px;font-weight:700}
.mapcard.full{position:fixed;inset:0;margin:0;border-radius:0;z-index:60}
.mapcard.full .mapwrap{height:100%}
.mapcard.full .mapfoot{display:none}

/* 區塊 */
.sec-h{padding:20px 16px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{margin:0;font-size:19px;font-weight:900;text-wrap:balance}
.sec-h span{font-size:13px;color:var(--sub)}
.tiles{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 6px;scroll-snap-type:x proximity;scroll-padding-left:16px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:0 0 auto;min-width:74px;scroll-snap-align:start;padding:0;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:7px}
.tile .ic{width:58px;height:58px;border-radius:20px;border:2px solid transparent;display:grid;place-items:center}
.tile span:last-child{font-size:12px;line-height:1.3;max-width:82px;text-align:center;word-break:keep-all}
.tile{width:84px}
.tip{margin:10px 16px 0;padding:12px 14px;border-radius:14px;background:#FFF8E6;display:flex;gap:10px;font-size:14px;line-height:1.6;color:#4A3A12}
.tip svg{flex:none;margin-top:2px}
.tip b{display:block;font-size:12px;color:#8A5A00}
.tile[aria-pressed="true"] span:last-child{font-weight:900}
.chips{display:flex;gap:8px;padding:0 16px 2px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.chips>*{scroll-snap-align:start}
/* 依商圈找：方形按鈕（裡面是店家數） */
.zone{flex:0 0 auto;min-width:64px;padding:0;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px}
.zone .sq{width:56px;height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:var(--ink);transition:transform .12s ease}
.zone .sq b{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}
.zone .sq small{font-size:11px;font-weight:700;color:var(--sub);margin-top:2px}
.zone .lbl{font-size:13px;white-space:nowrap}
.zone[aria-pressed="true"] .sq{background:var(--accent);border-color:var(--accent);color:#fff}
.zone[aria-pressed="true"] .sq small{color:#fff}
.zone[aria-pressed="true"] .lbl{font-weight:900}
.zone:active .sq{transform:scale(.95)}
/* 距離總站：圓形按鈕 */
.dist{flex:0 0 auto;min-width:64px;padding:0;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px}
.dist .ring{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:var(--ink);transition:transform .12s ease}
.dist .ring b{font-size:19px;font-weight:900}
.dist .ring small{font-size:11px;font-weight:700;color:var(--sub);margin-top:2px}
.dist .lbl{font-size:13px;white-space:nowrap}
.dist[aria-pressed="true"] .ring{background:var(--ink);border-color:var(--ink);color:#fff}
.dist[aria-pressed="true"] .ring small{color:#ddd}
.dist[aria-pressed="true"] .lbl{font-weight:900}
.dist:active .ring{transform:scale(.95)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.seg{margin:0 16px 14px;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:#ECEAE5}
.seg button{height:40px;border-radius:10px;border:0;background:transparent;font-size:14px;font-weight:700;color:#555}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.notice{margin:0 16px 14px;font-size:13px;color:var(--accent-ink)}

/* 結果卡片 */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 16px}
.card{position:relative;min-width:0}
.card-main{width:100%;padding:0;border:2px solid transparent;border-radius:18px;overflow:hidden;background:var(--card);box-shadow:0 4px 14px rgba(30,25,15,.07);text-align:left;display:flex;flex-direction:column}
.card.closed .card-main{border-color:#E03131}
.card.warn .card-main{border-color:#F59F00}
.card.closed .card-body b{text-decoration:line-through;text-decoration-color:#E03131}
.card-img{position:relative;height:100px;display:grid;place-items:center}
.badge.open{bottom:10px;right:10px}
.st-open{background:#E6F4EA;color:#1E7B3A}.st-shut{background:#FDEDED;color:#C92A2A}.st-warn{background:#FFF4DB;color:#8A5A00}.st-unk{background:#F1F1F1;color:#555}.st-new{background:#E6F0FA;color:#1864AB}
.review{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;line-height:1.5;color:#444;margin-top:2px}
.srcs{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.src{font-size:11px;padding:1px 6px;border-radius:6px;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.src.g{border-color:#F08C00;color:var(--accent-ink)}
.filters{display:flex;gap:8px;padding:0 16px 14px;flex-wrap:wrap}
.toggle{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:700}
.toggle[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pillrow{display:flex;flex-wrap:wrap;gap:6px}
.pill{height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:700;display:inline-flex;align-items:center}
.quote{padding:14px 16px;border-radius:14px;background:#FFF8E6;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.7}
.quote small{font-size:12px;font-weight:700;color:#8A5A00}
.badge{position:absolute;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:3px}
.badge.cat{top:10px;left:10px;background:#fff}
.badge.km{bottom:10px;left:10px;background:rgba(31,31,31,.8);color:#fff}
.card-body{padding:11px 12px 14px;display:flex;flex-direction:column;gap:3px}
.card-body b{font-size:15px;font-weight:900;line-height:1.35}
.card-body span{font-size:12px;color:var(--sub);line-height:1.45}
.fav{position:absolute;top:2px;right:2px;width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;padding:0}
.fav span{width:32px;height:32px;border-radius:16px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);display:grid;place-items:center}
.empty{margin:0 16px;padding:28px 20px;border-radius:18px;background:var(--card);text-align:center;display:flex;flex-direction:column;gap:6px}
.empty b{font-size:15px}.empty span{font-size:13px;color:var(--sub)}

/* 底部選單 */
nav.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));width:calc(min(480px,100vw) - 32px);height:68px;padding:6px;border-radius:34px;background:#fff;box-shadow:0 8px 28px rgba(30,25,15,.16);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;z-index:70}
nav.bottom button{border:0;border-radius:28px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:#444}
nav.bottom button[aria-current="page"]{background:var(--ink);color:#fff}

/* 詳細資料 */
.scrim{position:fixed;inset:0;background:rgba(20,16,10,.45);z-index:80}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100vw);z-index:90;background:#fff;border-radius:26px 26px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;max-height:88vh;overflow-y:auto}
.grip{align-self:center;width:40px;height:4px;border-radius:2px;background:#DADADA}
.sheet-head{display:flex;gap:14px;align-items:center}
.sheet-ic{flex:none;width:72px;height:72px;border-radius:18px;display:grid;place-items:center}
.sheet-head h2{margin:2px 0;font-size:21px;font-weight:900}
.sheet-tag{align-self:flex-start;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:700;display:inline-flex;align-items:center}
.sheet-km{font-size:13px;font-weight:700;color:var(--accent-ink)}
.info{padding:14px 16px;border-radius:14px;background:var(--bg);display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.6;color:#444}
.sheet-actions{display:flex;gap:10px}
.btn-line{flex:none;height:54px;padding:0 18px;border-radius:14px;border:1px solid #DADADA;background:#fff;font-size:15px;font-weight:700}
.btn-go{flex:1;height:54px;border-radius:14px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:700;text-decoration:none}

.leaflet-container{font-family:var(--font)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5" fill="#F08C00" stroke="none"/></svg></span>
      <div class="brand-text"><b>機捷特區・單元12生活區</b><span>台中捷運北屯總站・方圓 10 公里</span></div>
      <button class="map-toggle" id="mapToggle" aria-expanded="false" aria-controls="mapcard"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span>地圖</span></button>
    </div>
    <label class="search" for="q">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜尋科別、料理、店名" autocomplete="off">
    </label>
    <div class="tabs" id="tabs"></div>
  </header>

  <section class="mapcard" id="mapcard" hidden>
    <div class="mapwrap">
      <div id="map" role="region" aria-label="北屯總站周邊地圖"></div>
      <span class="map-chip"><span class="dot" style="background:#2F9E44"></span>北屯總站 10 km</span>
      <button class="round map-close" id="mapClose" aria-label="關閉大地圖" hidden style="background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1F1F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="mapfoot">
      <div class="stats" id="stats"></div>
      <button class="pill-dark" id="mapOpen">大地圖 ›</button>
    </div>
  </section>

  <div class="sec-h"><h2 id="tileTitle">想找什麼？</h2></div>
  <div class="tiles" id="tiles"></div>
  <div class="tip" id="tip" hidden></div>

  <div class="sec-h"><h2>依商圈找</h2><span>路段兩側與巷弄都算</span></div>
  <div class="chips" id="zones"></div>

  <div class="sec-h"><h2 id="chipTitle">距離</h2></div>
  <div class="chips" id="chips"></div>

  <div class="sec-h"><h2 id="resultTitle">所有地點</h2><span id="count"></span></div>
  <div class="seg" id="seg">
    <button data-sort="station" aria-pressed="true">離總站最近</button>
    <button data-sort="me" aria-pressed="false">離我最近</button>
  </div>
  <div class="filters">
    <button class="toggle" data-toggle="hideClosed" aria-pressed="false">隱藏休息中</button>
    <button class="toggle" data-toggle="groupOnly" aria-pressed="false">只看群友推薦</button>
  </div>
  <p class="notice" id="notice" hidden></p>
  <div class="empty" id="empty" hidden><b>找不到符合的地點</b><span>換個關鍵字，或到「投稿」推薦給大家</span></div>
  <div class="grid" id="grid"></div>
</div>

<nav class="bottom" aria-label="主選單">
  <button data-nav="home" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>搜尋</button>
  <button data-nav="map"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>地圖</button>
  <button data-nav="fav"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>已收藏</button>
  <button data-nav="submit"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>投稿</button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sName" hidden>
  <div class="grip"></div>
  <div class="sheet-head">
    <span class="sheet-ic" id="sIc"></span>
    <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
      <span class="sheet-tag" id="sTag"></span>
      <h2 id="sName"></h2>
      <span class="sheet-km" id="sKm"></span>
    </div>
  </div>
  <div class="pillrow" id="sPills"></div>
  <div class="quote" id="sQuote"></div>
  <div class="info" id="sInfo"></div>
  <div class="sheet-actions">
    <button class="btn-line" id="sBack">返回</button>
    <a class="btn-go" id="sGo" target="_blank" rel="noopener"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>開啟 Google 地圖導航</a>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ===== 設定：之後只要改這裡 ===== */
const CONFIG = {
  center: [24.18528, 120.70944],   // 台中捷運北屯總站
  radiusKm: 10,
  // 這兩個網址會從同資料夾的 config.json 讀取（GitHub 上編輯 config.json 即可），這裡是備用值
  // sheetCsvUrl：投稿表單的試算表（審核欄打勾的才會顯示，會「加進」內建資料，不會取代）
  sheetCsvUrl: '',
  // formUrl：投稿用的 Google 表單
  formUrl: ''
};
async function loadConfig() {
  try {
    const res = await fetch('config.json', { cache: 'no-store' });
    if (res.ok) Object.assign(CONFIG, await res.json());
  } catch (e) { /* 直接開檔案時讀不到，用上面的備用值 */ }
}

const $ = (s) => document.querySelector(s);
/* 重畫左右滑動的列時，保留原本滑到的位置 */
function setHTML(sel, html) { const el = $(sel), x = el.scrollLeft; el.innerHTML = html; el.scrollLeft = x; }
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg = (d, color, size, sw) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${sw||1.7}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
function km(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function loadFavs() { try { return JSON.parse(localStorage.getItem('btFavs') || '{}'); } catch (e) { return {}; } }

function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((x) => x.trim()));
}
/* Sheet 欄位（和附的 stores.csv 一樣）：名稱,大分類,第二層,第三層,位置,群友評價,營業狀況,資料來源,營業時間,緯度,經度,座標說明,Google地圖連結(選填) */
function fromSheet(rows) {
  const head = rows.shift().map((h) => h.replace(/^﻿/, '').trim());
  const col = (r, name) => (head.indexOf(name) < 0 ? '' : (r[head.indexOf(name)] || '').trim());
  return rows.map((r, i) => {
    const lat = parseFloat(col(r, '緯度')), lng = parseFloat(col(r, '經度'));
    return {
      id: 's' + i, name: col(r, '名稱'), main: col(r, '大分類'), sub: col(r, '第二層'), third: col(r, '第三層'),
      loc: col(r, '位置'), note: col(r, '群友評價'), status: col(r, '營業狀況') || '營業中',
      src: col(r, '資料來源').split(/[、,]/).map((s) => s.trim()).filter(Boolean), hours: col(r, '營業時間'),
      lat: isNaN(lat) ? null : lat, lng: isNaN(lng) ? null : lng, approx: col(r, '座標說明').includes('大約'),
      link: col(r, 'Google地圖連結'), zones: col(r, '商圈').split(/[、,]/).map((s) => s.trim()).filter(Boolean)
    };
  }).filter((p) => p.name && GROUPS[p.main]);

const yes = (v) => /^(✓|true|TRUE|是|v|V|y|Y)$/.test((v || '').trim());
const normName = (n) => (n || '').replace(/[（(].*?[）)]/g, '').replace(/[\s・。．\-–|｜]/g, '');
function fromForm(rows) {
  const head = rows.shift().map((h) => h.replace(/^\uFEFF/, '').trim());
  const col = (r, n) => (head.indexOf(n) < 0 ? '' : (r[head.indexOf(n)] || '').trim());
  const hasReview = head.includes('審核');
  return rows.map((r, i) => {
    if (hasReview && !yes(col(r, '審核'))) return null;
    const by = col(r, '推薦人');
    if (by === '範例資料') return null;
    const cat = col(r, '分類'), cut = cat.search(/[・\/／]/);
    const main0 = cut < 0 ? cat : cat.slice(0, cut), sub0 = cut < 0 ? '' : cat.slice(cut + 1);
    const main = GROUPS[main0] ? main0 : null; if (!main) return null;
    const third = col(r, '細項'), name = col(r, '名稱'); if (!name) return null;
    let sub = GROUPS[main].subs.includes(sub0) ? sub0 : null;
    if (!sub) { const k = FORM_KEYS.find(([m, re]) => m === main && re.test(third + ' ' + name)); sub = k ? k[2] : null; }
    if (!sub) sub = (FORM_SUB[main] || {})[sub0] || GROUPS[main].subs[0];
    const lat = parseFloat(col(r, '緯度')), lng = parseFloat(col(r, '經度'));
    return {
      id: 'f:' + name, name, main, sub, third: third || sub0 || '', loc: col(r, '地址'),
      note: col(r, '推薦理由'), status: '營業中', src: ['群友投稿'], by, phone: col(r, '電話'),
      hours: col(r, '營業時間'), link: col(r, 'Google地圖連結'),
      lat: isNaN(lat) ? null : lat, lng: isNaN(lng) ? null : lng, approx: false, zones: zonesOf(col(r, '地址'))
    };
  }).filter(Boolean);
}

  '北屯松竹': /北屯路|松竹路/, '文心崇德': /文心路|崇德路|崇德捷運站/, '昌平興安': /昌平路|興安路|興安街/, '潭子榮興': /榮興街|潭子/
};
function zonesOf(addr) { const a = (addr || '').replace(/[（(].*?[）)]/g, ''); return Object.keys(ZONE_KEYS).filter((z) => ZONE_KEYS[z].test(a)); }
/* 同名的店：用投稿補上準確座標、連結、電話、營業時間；新的店直接加進去 */
/* 店名寫法常不一樣（「台中佳美牙醫診所」vs「佳美牙醫診所」），去掉常見字後用包含或相似度比對 */
const nameKey = (n) => normName(n).replace(/台中|臺中|北屯|診所|醫院|餐廳|泰式|專科|分店|門市|總店|店/g, '').toLowerCase();
function bigrams(t) { const b = new Set(); for (let i = 0; i < t.length - 1; i++) b.add(t.slice(i, i + 2)); return b; }
function sameShop(a, b) {
  const x = nameKey(a), y = nameKey(b);
  if (!x || !y) return false;
  if (x === y) return true;
  if (Math.min(x.length, y.length) >= 3 && (x.includes(y) || y.includes(x))) return true;
  const A = bigrams(x), B = bigrams(y); let n = 0; A.forEach((g) => { if (B.has(g)) n++; });
  return A.size && B.size && n / Math.min(A.size, B.size) >= 0.7 && n >= 3;
}
function mergeForm(base, extra) {
  extra.forEach((f) => {
    const p = base.find((q) => q.main === f.main && sameShop(q.name, f.name));
    if (!p) { base.push(f); return; }
    if (f.lat != null && f.lng != null) { p.lat = f.lat; p.lng = f.lng; p.approx = false; }
    ['link', 'phone', 'hours'].forEach((k) => { if (f[k] && !p[k]) p[k] = f[k]; });
    if (f.loc && (!p.loc || p.loc.length < f.loc.length)) p.loc = f.loc;
    if (f.note && !(p.note || '').includes(f.note)) p.note = p.note ? p.note + '；' + f.note : f.note;
    if (!(p.src || []).includes('群友投稿')) p.src = (p.src || []).concat('群友投稿');
  });
  return base;
}

/* ===== 營業時間 =====
   支援：「每日 07:00-12:00」「三四五 15:00-19:00; 六日 12:00-20:00」
        「週三～週日 11:30-14:30」「週五 16:00-21:00」「11:00-21:00（週一公休）」
   只寫星期沒寫時間（例如「週四～週日」）視為時間未提供 */
const DAYMAP = { '日': 0, '天': 0, '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6 };
const ALLDAYS = [0, 1, 2, 3, 4, 5, 6];
function parseDays(txt) {
  if (!txt || /每日|每天/.test(txt)) return ALLDAYS.slice();
  const t = txt.replace(/週|星期|禮拜/g, '');
  const r = t.match(/^([一二三四五六日天])[～~至到\-–]([一二三四五六日天])$/);
  if (r) {
    const a = DAYMAP[r[1]] === 0 ? 7 : DAYMAP[r[1]], b = DAYMAP[r[2]] === 0 ? 7 : DAYMAP[r[2]], out = [];
    for (let d = a; out.length < 7; d = d % 7 + 1) { out.push(d % 7); if (d === b) break; }
    return out;
  }
  return [...t].filter((c) => c in DAYMAP).map((c) => DAYMAP[c]);
}
function parseHours(spec) {
  if (!spec) return null;
  if (/24\s*(小時|hr|H)/i.test(spec)) return [{ days: ALLDAYS.slice(), s: 0, e: 1440 }];
  let off = [];
  spec = spec.replace(/[（(]([^）)]*)公休[）)]/g, (_, d) => { off = parseDays(d); return ''; }).trim();
  const segs = [];
  spec.split(/[;；]/).forEach((part) => {
    part = part.trim(); if (!part) return;
    const m = part.match(/^(\D+?)\s*(\d.*)$/) || [null, '', part];
    if (!/\d/.test(m[2] || '')) return;
    const days = parseDays(m[1].trim()).filter((d) => !off.includes(d));
    m[2].split(/[,，、]/).forEach((r) => {
      const t = r.trim().match(/^(\d{1,2}):(\d{2})\s*[-–~]\s*(\d{1,2}):(\d{2})$/); if (!t) return;
      segs.push({ days, s: +t[1] * 60 + +t[2], e: +t[3] * 60 + +t[4] });
    });
  });
  return segs.length ? segs : null;
}
function taipeiNow() {
  const p = {};
  new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Taipei', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false })
    .formatToParts(new Date()).forEach((x) => { p[x.type] = x.value; });
  const wd = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 }[p.weekday];
  return { day: wd, min: (+p.hour % 24) * 60 + +p.minute };
}
/* 回傳 {key, label, cls}：closed=外框紅、warn=外框橘 */
function openState(p) {
  if (p.status === '已歇業') return { key: 'closed', label: '已歇業', cls: 'st-shut' };
  const segs = parseHours(p.hours);
  if (!segs) {
    if (p.status === '疑似歇業' || p.status === '待確認') return { key: 'warn', label: p.status, cls: 'st-warn' };
    return { key: 'unknown', label: '時間未提供', cls: 'st-unk' };
  }
  const { day, min } = taipeiNow(), prev = (day + 6) % 7;
  const open = segs.some((g) => (g.e > g.s)
    ? g.days.includes(day) && min >= g.s && min < g.e
    : (g.days.includes(day) && min >= g.s) || (g.days.includes(prev) && min < g.e));
  if (open) return { key: 'open', label: '營業中', cls: 'st-open' };
  const today = segs.some((g) => g.days.includes(day));
  return { key: 'closed', label: today ? '休息中' : '今日公休', cls: 'st-shut' };
}
function navUrl(p) {
  if (p.link) return p.link;
  if (p.src && p.src[0] === '範例') return `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;
  const loc = (p.loc || '').replace(/（.*?）/g, '');
  const area = /^(台中|預訂|宅配|機捷)/.test(loc) ? '台中' : '台中 ' + loc;
  return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(p.name.replace(/（.*?）/g, '') + ' ' + area);
}

/* ===== 狀態 ===== */
const ZONES = ['機捷單元12', '軍功東山', '北屯松竹', '文心崇德', '昌平興安', '潭子榮興'];
const MAIN_ORDER = ['美食', '生活', '運動', '醫院'];
const state = { tab: '美食', sub: '全部', third: '全部', zone: '全部', dist: 0, q: '', sort: 'station', me: null, favs: loadFavs(), places: [], hideClosed: false, groupOnly: false };
const hasPos = (p) => typeof p.lat === 'number' && typeof p.lng === 'number' && !isNaN(p.lat);
/* 第三層從資料整理；「家醫科・外傷・醫美」這種多重標籤拆開，依店家數排序 */
const tagsOf = (t) => (t || '').split(/[・、]/).map((s) => s.replace(/（.*?）/g, '').trim()).filter(Boolean);
const thirdTags = (p) => tagsOf(p.third);

const catsOf = (p) => [[p.sub, p.third]].concat(p.extra || []);
function thirdList(sub) {
  const count = {};
  state.places.forEach((p) => catsOf(p).forEach(([s, t]) => { if (s === sub) tagsOf(t).forEach((x) => { count[x] = (count[x] || 0) + 1; }); }));
  const list = Object.keys(count).sort((a, b) => count[b] - count[a]);

}
function renderZones() {

/* ===== 篩選 ===== */
function mainOf() { return (state.tab === '全部' || state.tab === '收藏') ? '全部' : state.tab; }
function filtered() {
  const main = mainOf(), q = state.q.trim();
  return state.places.filter((p) => {
    if (q && ![p.name, p.main, p.sub, p.third, p.loc, p.note].some((s) => (s || '').includes(q))) return false;
    if (state.hideClosed && openState(p).key === 'closed') return false;
    if (state.groupOnly && !(p.src || []).includes('群友推薦')) return false;
    if (state.tab === '收藏') return !!state.favs[p.id];
    if (main !== '全部' && p.main !== main) return false;
    if ((state.sub !== '全部' || state.third !== '全部') && !catsOf(p).some(([s, t]) =>
      (state.sub === '全部' || s === state.sub) && (state.third === '全部' || tagsOf(t).includes(state.third)))) return false;
    if (state.zone !== '全部' && !(p.zones || []).includes(state.zone)) return false;
    if (state.dist && (p.km == null || p.km > state.dist)) return false;
    return true;
  }).sort((a, b) => distOf(a) - distOf(b));
}
/* 沒有座標的排在最後 */

  if (!hasPos(p)) return 999;

  else if (ds.dist !== undefined) { state.dist = Number(ds.dist); renderChips(); renderResults(); }
  else if (ds.open) openSheet(ds.open);
  else if (ds.fav) { state.favs[ds.fav] = !state.favs[ds.fav]; if (!state.favs[ds.fav]) delete state.favs[ds.fav]; saveFavs(); renderResults(); }
  else if (ds.sort) setSort(ds.sort);
  else if (ds.toggle) { state[ds.toggle] = !state[ds.toggle]; t.setAttribute('aria-pressed', state[ds.toggle]); renderResults(); }
  else if (ds.nav) {
    if (ds.nav === 'map') setMapFull(true);
    else if (ds.nav === 'home') { setMapFull(false); if (state.tab === '收藏') { state.tab = '美食'; renderAll(); } window.scrollTo({ top: 0 }); }
    else if (ds.nav === 'fav') { setMapFull(false); state.tab = '收藏'; state.sub = '全部'; state.third = '全部'; renderAll(); setNav('fav'); document.getElementById('resultTitle').scrollIntoView({ block: 'start' }); }
    else if (ds.nav === 'submit') {
      if (CONFIG.formUrl) window.open(CONFIG.formUrl, '_blank', 'noopener');
      else { const n = $('#notice'); n.hidden = false; n.textContent = '投稿表單還沒設定：建立 Google 表單後，把網址填進程式最上面的 CONFIG.formUrl。'; n.scrollIntoView({ block: 'center' }); }
    }
  }
});
$('#mapOpen').addEventListener('click', () => setMapFull(true));
$('#mapToggle').addEventListener('click', () => { setMapInline(!mapInline); if (mapInline) window.scrollTo({ top: 0, behavior: 'smooth' }); });
$('#mapClose').addEventListener('click', () => setMapFull(false));
$('#scrim').addEventListener('click', closeSheet);
$('#sBack').addEventListener('click', closeSheet);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (!$('#sheet').hidden) closeSheet(); else setMapFull(false); } });
$('#q').addEventListener('input', (e) => { state.q = e.target.value; renderResults(); });

function setSort(s) {
  const n = $('#notice');
  if (s === 'me' && !state.me) {
    if (!navigator.geolocation) { n.hidden = false; n.textContent = '這個瀏覽器不支援定位，先用「離總站最近」排序。'; return; }
    n.hidden = false; n.textContent = '正在取得你的位置…';
    navigator.geolocation.getCurrentPosition((pos) => {
      state.me = [pos.coords.latitude, pos.coords.longitude]; n.hidden = true;
      if (meMarker) meMarker.remove();
      meMarker = L.circleMarker(state.me, { radius: 8, color: '#fff', weight: 3, fillColor: '#1C7ED6', fillOpacity: 1 }).addTo(map).bindTooltip('你的位置');
      setSort('me');
    }, () => { n.textContent = '沒有取得定位權限，先用「離總站最近」排序。'; }, { enableHighAccuracy: true, timeout: 10000 });
    return;
  }
  state.sort = s; n.hidden = s !== 'me' ? true : n.hidden;
  document.querySelectorAll('#seg button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.sort === s));
  renderResults();
}

/* ===== 啟動 ===== */
function finishPlaces(places) {
  places.forEach((p) => { p.km = hasPos(p) ? km(CONFIG.center, [p.lat, p.lng]) : null; });
  state.places = places.filter((p) => p.km == null || p.km <= CONFIG.radiusKm + 0.5);
}
async function boot() {
  /* 先用內建資料畫出來，不用等網路 */
  finishPlaces(STORES.map((p) => Object.assign({}, p)));
  renderStats(); renderAll();
  await loadConfig();
  if (CONFIG.sheetCsvUrl) {
    try {
      const res = await fetch(CONFIG.sheetCsvUrl, { cache: 'no-store' });
      const extra = fromForm(parseCSV(await res.text()));
      if (extra.length) {
        finishPlaces(mergeForm(STORES.map((p) => Object.assign({}, p)), extra));
        renderStats(); renderAll();
      }
    } catch (e) { /* 讀不到投稿就只顯示內建資料 */ }
  }
  /* 每分鐘重算一次「營業中／休息中」 */
  setInterval(() => { if ($('#sheet').hidden) renderResults(); }, 60000);
}
boot();
</script>
